<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirLab - Pneumatic Test Bench</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/translations.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="status-indicator" id="statusIndicator"></span>
                ðŸ'¨ <span data-i18n="title">AirLab - Pneumatic Test Bench</span>
                <span style="font-size: 0.5em; color: #999; margin-left: 10px;">v2.1.0</span>
            </h1>
            <div class="language-selector">
                <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" data-lang="pt" onclick="setLanguage('pt')">PT</button>
            </div>
        </header>

        <div id="messageContainer"></div>

        <!-- Circuit Controls Section -->
        <div class="section-header">
            <h2>⚡ <span data-i18n="circuitControls">Circuit Controls</span></h2>
        </div>

        <div class="circuits-grid">
            <!-- Circuit 1 -->
            <div class="circuit-card">
                <div class="circuit-header">
                    <div class="circuit-title" data-i18n="circuit1">Circuit 1</div>
                    <button class="btn btn-activate" id="activate-btn-1" onclick="toggleActivation(1)">
                        <span data-i18n="activate">Activate</span>
                    </button>
                </div>
                <div class="circuit-pressure" id="pressure-display-1" style="display: block;">
                    <span id="pressure-ch1">---</span>
                    <span class="channel-unit">mbar</span>
                    <span class="vacuum-indicator" id="vacuum-ch1"></span>
                </div>
                <div class="circuit-mode" id="mode-display-1">
                    <span class="mode-label" data-i18n="mode">Mode</span>:
                    <span class="mode-value" id="mode-value-1" data-i18n="vacuum">Vacuum</span>
                </div>
                <div class="circuit-controls">
                    <button class="btn btn-mode" onclick="toggleMode(1)" data-i18n="switchMode">Switch Mode</button>
                </div>
            </div>

            <!-- Circuit 2 -->
            <div class="circuit-card">
                <div class="circuit-header">
                    <div class="circuit-title" data-i18n="circuit2">Circuit 2</div>
                    <button class="btn btn-activate" id="activate-btn-2" onclick="toggleActivation(2)">
                        <span data-i18n="activate">Activate</span>
                    </button>
                </div>
                <div class="circuit-pressure" id="pressure-display-2" style="display: block;">
                    <span id="pressure-ch2">---</span>
                    <span class="channel-unit">mbar</span>
                    <span class="vacuum-indicator" id="vacuum-ch2"></span>
                </div>
                <div class="circuit-mode" id="mode-display-2">
                    <span class="mode-label" data-i18n="mode">Mode</span>:
                    <span class="mode-value" id="mode-value-2" data-i18n="vacuum">Vacuum</span>
                </div>
                <div class="circuit-controls">
                    <button class="btn btn-mode" onclick="toggleMode(2)" data-i18n="switchMode">Switch Mode</button>
                </div>
            </div>

            <!-- Circuit 3 -->
            <div class="circuit-card">
                <div class="circuit-header">
                    <div class="circuit-title" data-i18n="circuit3">Circuit 3</div>
                    <button class="btn btn-activate" id="activate-btn-3" onclick="toggleActivation(3)">
                        <span data-i18n="activate">Activate</span>
                    </button>
                </div>
                <div class="circuit-pressure" id="pressure-display-3" style="display: block;">
                    <span id="pressure-ch3">---</span>
                    <span class="channel-unit">mbar</span>
                    <span class="vacuum-indicator" id="vacuum-ch3"></span>
                </div>
                <div class="circuit-mode" id="mode-display-3">
                    <span class="mode-label" data-i18n="mode">Mode</span>:
                    <span class="mode-value" id="mode-value-3" data-i18n="vacuum">Vacuum</span>
                </div>
                <div class="circuit-controls">
                    <button class="btn btn-mode" onclick="toggleMode(3)" data-i18n="switchMode">Switch Mode</button>
                </div>
            </div>

            <!-- Circuit 4 -->
            <div class="circuit-card">
                <div class="circuit-header">
                    <div class="circuit-title" data-i18n="circuit4">Circuit 4</div>
                    <button class="btn btn-activate" id="activate-btn-4" onclick="toggleActivation(4)">
                        <span data-i18n="activate">Activate</span>
                    </button>
                </div>
                <div class="circuit-pressure" id="pressure-display-4" style="display: block;">
                    <span id="pressure-ch4">---</span>
                    <span class="channel-unit">mbar</span>
                    <span class="vacuum-indicator" id="vacuum-ch4"></span>
                </div>
                <div class="circuit-mode" id="mode-display-4">
                    <span class="mode-label" data-i18n="mode">Mode</span>:
                    <span class="mode-value" id="mode-value-4" data-i18n="vacuum">Vacuum</span>
                </div>
                <div class="circuit-controls">
                    <button class="btn btn-mode" onclick="toggleMode(4)" data-i18n="switchMode">Switch Mode</button>
                </div>
            </div>
        </div>

        <div class="calibration-panel">
            <div class="calibration-buttons">
                <button class="btn btn-primary" onclick="calibrateAll()" data-i18n="calibrate">Calibrate</button>
                <button class="btn btn-secondary" onclick="toggleUnit()"><span data-i18n="unit">Unit</span>: <span id="unitToggleText">mbar</span></button>
            </div>
        </div>

        <div class="info-box">
            <p class="info-text" style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <a href="/signals" style="color: #4b6cb7; text-decoration: none; font-weight: bold;">📡 <span data-i18n="signalsPage">Digital Signals</span></a> | <a href="/debug" style="color: #4b6cb7; text-decoration: none; font-weight: bold;">ðŸ” <span data-i18n="debugPage">Debug Page</span></a>
                <button class="btn btn-danger" onclick="shutdownRaspberry()" style="padding: 8px 16px; font-size: 0.9em;">
                    ðŸ”´ <span data-i18n="shutdown">Shutdown Raspberry Pi</span>
                </button>
            </p>
        </div>
    </div>

    <script>
        // Translation update function for this page
        function updatePageTranslations() {
            // Update title
            const titleSpan = document.querySelector('[data-i18n="title"]');
            if (titleSpan) titleSpan.textContent = t('title');
            
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (key && translations[currentLang] && translations[currentLang][key]) {
                    element.textContent = translations[currentLang][key];
                }
            });
            
            // Update status badges
            document.querySelectorAll('.status-badge').forEach(badge => {
                const status = badge.textContent.trim();
                if (status === 'OK') badge.textContent = t('statusOk');
                else if (status === 'ERROR' || status === 'ERRO') badge.textContent = t('statusError');
                else if (status === 'WARNING' || status === 'AVISO') badge.textContent = t('statusWarning');
            });
        }
        
    
        // Unit toggle state (default: bar)
        let currentUnit = 'bar';

        function toggleUnit() {
            if (currentUnit === 'mbar') {
                currentUnit = 'bar';
                document.getElementById('unitToggleText').textContent = 'mbar';
            } else {
                currentUnit = 'mbar';
                document.getElementById('unitToggleText').textContent = 'bar';
            }
            // Refresh display with new unit
            updateData();
        }

        function convertToDisplayValue(mbarValue) {
            if (currentUnit === 'bar') {
                return (mbarValue / 1000).toFixed(3);
            }
            return mbarValue;
        }

        function getCurrentUnit() {
            return currentUnit;
        }

        function updateData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Update channel values and status
                        for (let i = 1; i <= 4; i++) {
                            const ch = data.channels[`ch${i}`];
                            
                            // Update pressure value with unit conversion
                            const pressure = ch.pressure_mbar;
                            const displayValue = convertToDisplayValue(pressure);
                            const unit = getCurrentUnit();
                            
                            document.getElementById(`pressure-ch${i}`).textContent = displayValue;
                            
                            // Update unit display
                            const unitSpans = document.querySelectorAll('.channel-unit');
                            unitSpans.forEach(span => {
                                span.textContent = unit;
                            });
                            
                            // Update vacuum indicator
                            const vacuumIndicator = document.getElementById(`vacuum-ch${i}`);
                            if (pressure < -50) {
                                vacuumIndicator.textContent = 'ðŸ’¨';
                                vacuumIndicator.title = 'Vacuum active';
                            } else {
                                vacuumIndicator.textContent = '';
                            }
                            
                            // Update status badge
                            const statusBadge = document.getElementById(`status-ch${i}`);
                            statusBadge.textContent = ch.status;
                            statusBadge.className = 'status-badge ' + 
                                (ch.status === 'OK' ? 'status-ok' : 
                                 ch.status === 'ERROR' ? 'status-error' : 'status-warning');
                        }
                        
                        // Clear any error messages
                        const messageContainer = document.getElementById('messageContainer');
                        if (messageContainer.innerHTML.includes('error-message')) {
                            messageContainer.innerHTML = '';
                        }
                    } else {
                        showError('Failed to read data from EtherCAT master');
                    }
                })
                .catch(error => {
                    showError('Connection error: ' + error);
                });
        }

        function calibrateAll() {
            fetch('/api/calibrate', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showSuccess(t('calibrationSuccess'));
                        updateData(); // Refresh immediately
                    } else {
                        showError(t('calibrationFailed') + ' ' + data.error);
                    }
                })
                .catch(error => {
                    showError(t('connectionError') + ' ' + error);
                });
        }

        function resetCalibration() {
            if (confirm(t('resetConfirm'))) {
                fetch('/api/reset_calibration', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showSuccess(t('resetSuccess'));
                            updateData(); // Refresh immediately
                        } else {
                            showError('Reset failed: ' + data.error);
                        }
                    })
                    .catch(error => {
                        showError('Reset error: ' + error);
                    });
            }
        }

        function showError(message) {
            const messageContainer = document.getElementById('messageContainer');
            messageContainer.innerHTML = 
                `<div class="error-message">Ã¢Å¡Â Ã¯Â¸Â ${message}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        function showSuccess(message) {
            const messageContainer = document.getElementById('messageContainer');
            messageContainer.innerHTML = 
                `<div class="success-message">âœ… ${message}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 3000);
        }

        function shutdownRaspberry() {
            if (confirm('âš ï¸ ' + t('shutdownConfirm'))) {
                fetch('/api/shutdown', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showSuccess(t('shutdownSuccess'));
                        } else {
                            showError('Shutdown failed: ' + data.error);
                        }
                    })
                    .catch(error => {
                        showError('Shutdown error: ' + error);
                    });
            }
        }

        // Circuit Control Functions
        // DOs 1-4: Activate circuits 1-4
        // DOs 5-8: Switch mode (0=vacuum, 1=compressed air) for circuits 1-4

        function toggleMode(circuitNum) {
            // Mode is controlled by DO (4 + circuitNum), i.e., DOs 5-8
            const modeOutput = 4 + circuitNum;

            fetch('/api/outputs')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const currentMode = data.outputs[modeOutput - 1]; // Array is 0-indexed
                        const newMode = currentMode === 1 ? 0 : 1;

                        // Set the new mode
                        setOutput(modeOutput, newMode);
                    }
                })
                .catch(error => {
                    showError('Error reading mode: ' + error);
                });
        }

        function toggleActivation(circuitNum) {
            // Activation is controlled by DO circuitNum, i.e., DOs 1-4
            fetch('/api/outputs')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const currentActivation = data.outputs[circuitNum - 1]; // Array is 0-indexed
                        const newActivation = currentActivation === 1 ? 0 : 1;

                        // Set the new activation state
                        setOutput(circuitNum, newActivation);
                    }
                })
                .catch(error => {
                    showError('Error reading activation: ' + error);
                });
        }

        function setOutput(outputNum, value) {
            fetch('/api/outputs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    output: outputNum,
                    value: value
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Force immediate update of circuit status
                    setTimeout(updateCircuitStatus, 100);
                } else {
                    showError('Failed to set output: ' + data.error);
                }
            })
            .catch(error => {
                showError('Error setting output: ' + error);
            });
        }

        function updateCircuitStatus() {
            fetch('/api/outputs')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Update all 4 circuits
                        for (let i = 1; i <= 4; i++) {
                            // Get activation state (DOs 1-4)
                            const activationState = data.outputs[i - 1];
                            // Get mode state (DOs 5-8)
                            const modeState = data.outputs[i + 3]; // Index 4-7 for DOs 5-8

                            // Update mode display
                            const modeValueElement = document.getElementById(`mode-value-${i}`);
                            const pressureDisplay = document.getElementById(`pressure-display-${i}`);

                            if (modeValueElement) {
                                if (modeState === 0) {
                                    // Vacuum mode
                                    modeValueElement.textContent = translations[currentLang].vacuum;
                                    modeValueElement.setAttribute('data-i18n', 'vacuum');
                                    // Show pressure display in vacuum mode
                                    if (pressureDisplay) {
                                        pressureDisplay.style.display = 'block';
                                    }
                                } else {
                                    // Compressed air mode
                                    modeValueElement.textContent = translations[currentLang].compressedAir;
                                    modeValueElement.setAttribute('data-i18n', 'compressedAir');
                                    // Hide pressure display in compressed air mode
                                    if (pressureDisplay) {
                                        pressureDisplay.style.display = 'none';
                                    }
                                }
                            }

                            // Update activation button
                            const activateBtn = document.getElementById(`activate-btn-${i}`);
                            if (activateBtn) {
                                const btnSpan = activateBtn.querySelector('span');
                                if (btnSpan) {
                                    if (activationState === 1) {
                                        btnSpan.textContent = translations[currentLang].deactivate;
                                        btnSpan.setAttribute('data-i18n', 'deactivate');
                                        activateBtn.classList.add('active');
                                    } else {
                                        btnSpan.textContent = translations[currentLang].activate;
                                        btnSpan.setAttribute('data-i18n', 'activate');
                                        activateBtn.classList.remove('active');
                                    }
                                }
                            }
                        }
                    }
                })
                .catch(error => {
                    console.error('Error updating circuit status:', error);
                });
        }

        // Auto-refresh every 500ms (2 Hz)
        setInterval(updateData, 500);
        setInterval(updateCircuitStatus, 500);

        // Initial load
        updateData();
        updateCircuitStatus();
    </script>
</body>
</html>
